name: Update publication citations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-citations.yml'
      - '.github/scripts/update_citations.py'

permissions:
  contents: write

concurrency:
  group: publication-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch citation counts from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python .github/scripts/update_citations.py

      - name: Commit changed citation data
        run: |
          if git diff --quiet -- assets/data/citations.json; then
            echo "Citation counts unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/citations.json
          git commit -m "Update publication citation counts"
          git push
